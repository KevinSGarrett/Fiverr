providers:
  cursorcli:
    enabled: true
    role: primary_coding_worker
    billing_mode: cursor_subscription
    can_edit_files: true
    official_pm_review: false
    approved_for:
      - implementation
      - repair
      - test_generation
      - docs_agent_work
    blocked_for:
      - official_post_cycle_pm_review
      - merge_gate_decision
      - jira_done_transition
      - git_commit
      - git_push
    required_gates:
      - model_verified
      - prompt_validated
      - lane_scope_enforced

  cursor_cli:
    enabled: true
    role: primary_coding_worker_alias
    billing_mode: cursor_subscription
    can_edit_files: true
    official_pm_review: false
    approved_for:
      - implementation
      - repair
      - test_generation
      - docs_agent_work
      - cursor_execution
    blocked_for:
      - official_post_cycle_pm_review
      - merge_gate_decision
      - jira_done_transition
      - git_commit
      - git_push

  claude_subscription:
    enabled: true
    role: official_pm_review
    billing_mode: claude_subscription_only
    can_edit_files: false
    official_pm_review: true
    approved_for:
      - official_post_cycle_review
      - pm_pack_governance_review
      - architecture_review
    blocked_for:
      - direct_code_edit
      - implementation
      - repair
      - api_billing_fallback
    on_limit:
      action: pause_official_review
      do_not_fallback_to_api: true

  openai_api:
    enabled: true
    role: budget_controlled_helper
    billing_mode: openai_api_key
    can_edit_files: false
    approved_for:
      - prompt_lint
      - json_classification
      - rubric_scoring
      - summary_generation
    hard_limits:
      daily_usd: 10
      monthly_usd: 150
    soft_warn:
      daily_usd: 5

  codex_subscription:
    enabled: true
    status: ACTIVE
    role: secondary_coder
    billing_mode: chatgpt_subscription_only
    api_key_billing_allowed: false
    allowed_task_types:
      - docs_agent_work
      - test_generation
    not_allowed:
      - code_implementation
      - official_post_cycle_review

routes:
  implementation: cursor_cli
  code_implementation: cursor_cli
  repair: cursor_cli
  test_generation: codex_subscription
  docs_agent_work: codex_subscription
  prompt_lint: openai_api
  json_classification: openai_api
  official_post_cycle_review: claude_subscription
  architecture_review: claude_subscription
  merge_gate: deterministic_controller
  jira_transition: deterministic_controller
  prompt_contract_generation: deterministic_prompt_factory
  prompt_rendering: deterministic_prompt_factory
  prompt_validation: deterministic_validator
  cursor_execution: cursor_cli
  secondary_code_review: codex_subscription
  promptcontractgeneration: deterministic_prompt_factory
  promptrendering: deterministic_prompt_factory
  promptvalidation: deterministic_validator
  cursorexecution: cursor_cli
  secondarycode_review: codex_subscription
