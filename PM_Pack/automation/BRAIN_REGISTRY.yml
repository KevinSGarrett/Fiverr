  required_for_build: true
  files:
  - 01_PRODUCT_DEFINITION.md
  - 02_REPORT_TEMPLATE.md
  - 03_JIRA_EPICS.md
  - 04_NICHE_QUEUE_GTM.md
  description: "Fiverr niche research product \u2014 what to build, how to score,\
    \ what the reports look like"
