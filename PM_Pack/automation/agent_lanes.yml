version: 1
active_model: six_lane
# Execution order: A first, then B, then E (waits for B's first commit), then C, F, D.
# B+E can run in parallel in future worktree mode. Sequential for v1.
default_order:
  - A
  - B
  - E
  - C
  - F
  - D

lanes:
  A:
    role: planner_foundation_integration
    label: "agent:A"
    description: "PM planning, architecture, docs, GitHub governance, config"
    owns:
      - "PM_Pack/**"
      - "docs/**"
      - ".github/**"
      - "pyproject.toml"
      - "config.yaml"
      - ".cursorrules"
    prohibited_without_explicit_task:
      - "src/**"
      - "tests/**"
      - "data/**"
    allowed_paths:
      - "automation/**"
      - "PM_Pack/**"
      - "docs/architecture/**"
      - "docs/cycle_reports/**"
    blocked_paths:
      - "src/**"
      - "tests/integration/**"
    validation_commands:
      - "python automation/ai_cycle_controller.py brain-check"
      - "python automation/ai_cycle_controller.py pm-pack-audit"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55

  B:
    role: primary_implementation
    label: "agent:B"
    description: "Primary src/ and tests/ author — new features, core logic"
    owns:
      - "src/**"
      - "tests/**"
    requires_extra_gate: true
    allowed_paths:
      - "src/**"
      - "tests/unit/**"
    blocked_paths:
      - "PM_Pack/**"
    validation_commands:
      - "ruff check src/ --output-format=concise"
      - "mypy src/ --ignore-missing-imports --no-error-summary"
      - "pytest tests/unit -q"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55

  E:
    role: live_validation_external_signals
    label: "agent:E"
    description: "Live data validation, external signal collection, evidence files"
    owns:
      - "docs/cycle_reports/**"
      - "data/evidence/**"
      - "scripts/validation/**"
    cost_guard: controlled_budget_only
    wait_for_b_first_commit: true
    prohibited:
      - "src/**"
      - "tests/**"
      - "config.yaml"
    allowed_paths:
      - "data/evidence/**"
      - "docs/cycle_reports/**"
      - "scripts/validation/**"
    blocked_paths:
      - "src/**"
      - "tests/**"
    validation_commands:
      - "python automation/ai_cycle_controller.py brain-check"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55

  C:
    role: integration_validation
    label: "agent:C"
    description: "Integration checks, validation run, cycle report"
    owns:
      - "docs/cycle_reports/**"
      - "PM_Pack/10_cycle_log/**"
    prohibited:
      - "src/**"
    allowed_paths:
      - "docs/cycle_reports/**"
      - "PM_Pack/10_cycle_log/**"
      - "automation/**"
    blocked_paths:
      - "src/**"
    validation_commands:
      - "python automation/ai_cycle_controller.py validate-prompts --cycle 078"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55

  F:
    role: test_coverage_regression
    label: "agent:F"
    description: "Test coverage gaps, regression tests, coverage enforcement"
    owns:
      - "tests/**"
    allowed_paths:
      - "tests/**"
    blocked_paths:
      - "src/**"
    validation_commands:
      - "pytest tests/unit -q"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55

  D:
    role: pr_steward_merge_gate
    label: "agent:D"
    description: "PR body, Jira evidence, GitHub status, merge gate preparation"
    owns:
      - "docs/cycle_reports/**"
    jira_authority: true
    github_pr_authority: true
    allowed_paths:
      - "docs/cycle_reports/**"
      - "PM_Pack/**"
    blocked_paths:
      - "src/**"
      - "tests/**"
    validation_commands:
      - "python automation/ai_cycle_controller.py merge-gate --pr 0 --dry-run"
    provider_policy_ref: "PM_Pack/automation/provider_policy.yml"
    min_tasks: 55
