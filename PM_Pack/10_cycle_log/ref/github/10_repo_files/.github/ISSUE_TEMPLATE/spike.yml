name: Spike / Research
description: Research or investigation task before implementation
title: "[Spike]: "
labels: ["issue:spike", "priority:P3-medium"]
body:
  - type: textarea
    id: question
    attributes:
      label: Research Question
      description: What do we need to figure out?
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why is this research needed? What decision depends on it?
    validations:
      required: true
  - type: textarea
    id: approach
    attributes:
      label: Proposed Approach
      description: How will you investigate this?
      placeholder: |
        1. Read documentation for X
        2. Build a minimal prototype
        3. Benchmark performance
  - type: input
    id: timebox
    attributes:
      label: Timebox
      description: Maximum time to spend on this spike
      placeholder: "4 hours"
    validations:
      required: true
  - type: textarea
    id: deliverable
    attributes:
      label: Expected Deliverable
      description: What will this spike produce?
      placeholder: "A written summary with recommendation, posted as a comment on this issue"
    validations:
      required: true
  - type: input
    id: epic
    attributes:
      label: Related Epic
      placeholder: "Epic 02, Epic 04, etc."
