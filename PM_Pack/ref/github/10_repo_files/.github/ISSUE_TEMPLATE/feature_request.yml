name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["issue:enhancement", "priority:P3-medium"]
body:
  - type: textarea
    id: description
    attributes:
      label: Feature Description
      description: What feature do you want to add?
    validations:
      required: true
  - type: textarea
    id: motivation
    attributes:
      label: Motivation
      description: Why is this feature needed? What problem does it solve?
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Proposed Solution
      description: How should this feature work?
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: What other approaches were considered?
  - type: input
    id: epic
    attributes:
      label: Related Epic
      placeholder: "Epic 01, Epic 02, etc."
