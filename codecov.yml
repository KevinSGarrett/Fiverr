# Keep Codecov statuses as merge blockers after first CI run creates check names.
# Both contexts must remain required in branch protection.
coverage:
  status:
    project:
      default:
        name: codecov/project
        target: 90%
        threshold: 1%
        informational: false
    patch:
      default:
        name: codecov/patch
        target: 90%
        threshold: 1%
        informational: false
