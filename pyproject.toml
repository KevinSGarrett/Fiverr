[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fiverr-research-system"
version = "0.1.0"
description = "Local-first Fiverr niche and opportunity research system."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Fiverr Research Team" }]
dependencies = [
  "apscheduler>=3.10,<4.0",
  "click>=8.1,<9.0",
  "jinja2>=3.1,<4.0",
  "numpy>=1.26,<3.0",
  "openai>=1.30,<2.0",
  "openpyxl>=3.1,<4.0",
  "pandas>=2.2,<3.0",
  "playwright>=1.45,<2.0",
  "pydantic>=2.7,<3.0",
  "python-dotenv>=1.0,<2.0",
  "praw>=7.7,<8.0",
  "pytrends>=4.9,<5.0",
  "pyyaml>=6.0,<7.0",
  "scikit-learn>=1.5,<2.0",
  "scipy>=1.13,<2.0",
  "sqlalchemy>=2.0,<3.0",
  "streamlit>=1.35,<2.0",
  "weasyprint>=62.0,<70.0",
  "plotly>=5.22,<7.0",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.10,<2.0",
  "pytest>=8.2,<9.0",
  "pytest-asyncio>=1.3,<2.0",
  "pytest-cov>=5.0,<6.0",
  "ruff>=0.4,<0.7",
  "types-pyyaml>=6.0.12",
]

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
include = ["src", "src.*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
pythonpath = ["."]

[tool.coverage.run]
source = ["src"]
omit = [
  "tests/*",
  "**/__pycache__/*",
  ".pytest_cache/*",
  ".mypy_cache/*",
  "data/*",
]

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 90

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]
extend-exclude = ["PM_Pack"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
disallow_untyped_defs = true
no_implicit_optional = true
check_untyped_defs = true
exclude = ["tests"]
