name: AI Cycle Runner

on:
  workflow_dispatch:
    inputs:
      cycle:
        description: "Cycle number (e.g. 075) or auto"
        required: false
        default: "auto"
      mode:
        description: "Controller command to run"
        required: true
        default: "brain-check"
        type: choice
        options:
          - brain-check
          - compile-policy
          - jira-inventory
          - plan-cycle
          - validate-prompts
          - cursor-smoke
          - tick
          - status
          - post-cycle-review
          - merge-gate
          - daily-report
          - weekly-report
          - recover
  schedule:
    - cron: "*/30 * * * *"

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: read
  statuses: read
  actions: read

concurrency:
  group: ai-cycle-runner
  cancel-in-progress: false

jobs:
  ai-cycle:
    name: AI Cycle Controller
    # Labels must match exactly what the runner registered with
    runs-on: [self-hosted, fiverr-runner, windows, cursor, dedicated, ai-dev]
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GH_AUTOMATION_TOKEN }}

      - name: Verify NOT running run-agent via workflow dispatch
        shell: pwsh
        run: |
          $mode = "${{ github.event.inputs.mode || '' }}"
          if ($mode -eq "run-agent") {
            Write-Error "run-agent must not be dispatched directly via workflow. Use tick or plan-cycle."
            exit 1
          }

      - name: Set Cursor CLI path environment
        shell: pwsh
        run: |
          # Ensure standalone Cursor CLI (not Cursor Desktop) is on PATH
          $cliDir = "C:\Users\Windows 11\AppData\Local\cursor-agent"
          if (-not (Test-Path "$cliDir\agent.cmd")) {
            Write-Error "Cursor CLI agent.cmd not found at $cliDir. Install via: irm 'https://cursor.com/install?win32=true' | iex"
            exit 1
          }
          # Fail hard if Desktop binary would be used instead
          $desktop = "C:\Users\Windows 11\AppData\Local\Programs\cursor\resources\app\bin\cursor.CMD"
          $env:PATH = "$cliDir;$env:PATH"
          Write-Host "Cursor CLI: $cliDir\agent.cmd"
          & "$cliDir\agent.cmd" --version

      - name: Run AI cycle controller
        shell: pwsh
        env:
          GH_AUTOMATION_TOKEN: ${{ secrets.GH_AUTOMATION_TOKEN }}
          JIRA_BASE_URL: ${{ secrets.JIRA_BASE_URL }}
          JIRA_EMAIL: ${{ secrets.JIRA_EMAIL }}
          JIRA_API_TOKEN: ${{ secrets.JIRA_API_TOKEN }}
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        run: |
          Set-Location C:\Fiverr\Fiverr
          $py    = ".venv\Scripts\python.exe"
          $ctrl  = "automation\ai_cycle_controller.py"
          $mode  = "${{ github.event.inputs.mode || 'tick' }}"
          $cycle = "${{ github.event.inputs.cycle || 'auto' }}"

          Write-Host "Mode: $mode  Cycle: $cycle"

          # Build arguments
          $args = @($ctrl, $mode)
          if ($cycle -ne "auto" -and $mode -in @("plan-cycle","validate-prompts","post-cycle-review","run-agent")) {
            $args += @("--cycle", $cycle)
          }
          if ($mode -eq "plan-cycle") {
            $args += "--dry-run"
          }

          & $py @args
          if ($LASTEXITCODE -ne 0) {
            Write-Error "Controller exited $LASTEXITCODE"
            exit $LASTEXITCODE
          }
