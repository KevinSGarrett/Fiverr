name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "cycle/**/integration"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check automation/ src/ tests/

  type-check:
    name: CI / type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy automation/ src/ --ignore-missing-imports

  tests-coverage:
    name: CI / tests-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CI state bootstrap
        run: |
          python -c "
          import json
          from pathlib import Path
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/secrets').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state/controller_state.json').write_text(
              json.dumps({'status': 'PLANNED', 'active_cycle': 80, 'last_merged_cycle': 79})
          )
          Path('C:/AI_Runner/state/heartbeat.json').write_text(
              json.dumps(
                  {'last_seen': '2026-06-15T00:00:00Z', 'status': 'OK', 'active_cycle': 80}
              )
          )
          Path('PM_Pack/automation').mkdir(parents=True, exist_ok=True)
          Path('PM_Pack/automation/current_policy_snapshot.json').write_text(
              json.dumps({'cycle_current': 80, 'last_completed_cycle': 'C079'})
          )
          Path('C:/AI_Runner/secrets/runner.env').write_text('JIRA_API_TOKEN=ci-placeholder')
          "
      - name: Pytest with coverage
        run: >
          python -m pytest tests/unit/
          --ignore=tests/unit/test_queue_processor.py
          --ignore=tests/unit/test_collection_orchestrator.py
          --ignore=tests/unit/test_cycle062_smoke_aliases.py
          --ignore=tests/unit/test_post_cycle_review_coverage.py
          --cov=src --cov=automation --cov-report=xml --cov-fail-under=90 --timeout=60
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  smoke-gates:
    name: CI / smoke-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CI state bootstrap
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path "C:\AI_Runner\state"
          '{"status":"PLANNED","active_cycle":80,"last_merged_cycle":79}' | Out-File -FilePath "C:\AI_Runner\state\controller_state.json" -Encoding utf8
          '{"last_seen":"2026-06-15T00:00:00Z","status":"OK","active_cycle":80}' | Out-File -FilePath "C:\AI_Runner\state\heartbeat.json" -Encoding utf8
          '{"cycle_current":80,"last_completed_cycle":"C079"}' | Out-File -FilePath "PM_Pack\automation\current_policy_snapshot.json" -Encoding utf8
      - name: Brain check
        run: python automation/ai_cycle_controller.py brain-check
      - name: PM Pack audit
        run: python automation/ai_cycle_controller.py pm-pack-audit






