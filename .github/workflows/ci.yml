name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "cycle/**/integration"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check automation/ src/ tests/ --ignore I001,UP035,W605

  codex-review-gate:
    name: CI / codex-review-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install minimal deps
        run: python -m pip install requests
      - name: Check all Codex review threads are resolved
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}
        run: python automation/codex_review_gate.py

  type-check:
    name: CI / type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy src

  tests-coverage:
    name: CI / tests-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CI state bootstrap
        run: |
          python -c "
          import json
          from pathlib import Path
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/secrets').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state/controller_state.json').write_text(
              json.dumps({'status': 'PLANNED', 'active_cycle': 84, 'last_merged_cycle': 83})
          )
          Path('C:/AI_Runner/state/heartbeat.json').write_text(
              json.dumps(
                  {'last_seen': '2026-06-17T00:00:00Z', 'status': 'OK', 'active_cycle': 84}
              )
          )
          Path('C:/AI_Runner/state/provider_health.json').write_text(
              json.dumps(
                  {
                      'cursor_cli': {'status': 'HEALTHY', 'last_ok': '2026-06-15T00:00:00Z'},
                      'claude_subscription': {'status': 'HEALTHY'},
                      'openai_api': {'status': 'HEALTHY'},
                      'codex_subscription': {'status': 'HEALTHY'},
                  }
              )
          )
          Path('PM_Pack/automation').mkdir(parents=True, exist_ok=True)
          Path('PM_Pack/automation/current_policy_snapshot.json').write_text(
              json.dumps({'cycle_current': 84, 'last_completed_cycle': 'C083'})
          )
          Path('C:/AI_Runner/secrets/runner.env').write_text('JIRA_API_TOKEN=ci-placeholder')
          "
      - name: Pytest with coverage
        # CI-validity (item 3.3): the loop-critical test modules
        # (cursor_adapter, prompt_generator, prompt_contract_builder,
        # queue_processor, collection_orchestrator, openai_api_adapter) are NO
        # LONGER ignored -- green CI must mean the loop-critical core is tested.
        # The remaining ignores are genuinely product/legacy modules tracked
        # separately. Keep this list in sync with automation/post_cycle_review.py.
        run: >
          python -m pytest tests/unit/
          --ignore=tests/unit/test_cycle062_smoke_aliases.py
          --ignore=tests/unit/test_playbook_generator.py
          --ignore=tests/unit/test_automation_system_restriction_removal.py
          --cov=src --cov=automation
          --cov-config=pyproject.toml
          --cov-report=xml --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
  smoke-gates:
    name: CI / smoke-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5.5.0
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      # CI-validity (item 3.3 / CICD-06): the state written below is a CI FIXTURE,
      # NOT real runner state. brain-check/pm-pack-audit need runner state to exist
      # on the ubuntu CI box, so we bootstrap a synthetic, internally-consistent
      # snapshot. Because the fixture is always-consistent by construction, the
      # smoke-gates here verify the gate *code paths* run -- they do NOT validate
      # real state consistency. Genuine state-consistency validation (pm-pack-audit
      # comparing against real recorded values) is tracked as deferred item D-7.
      # Do not treat a green smoke-gates as proof that live runner state is sane.
      - name: CI state bootstrap
        run: |
          python -c "
          import json
          import re
          from pathlib import Path
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state/controller_state.json').write_text(
              json.dumps({'status': 'PLANNED', 'active_cycle': 84, 'last_merged_cycle': 83})
          )
          Path('C:/AI_Runner/state/heartbeat.json').write_text(
              json.dumps(
                  {'last_seen': '2026-06-17T00:00:00Z', 'status': 'OK', 'active_cycle': 84}
              )
          )
          Path('PM_Pack/automation').mkdir(parents=True, exist_ok=True)
          Path('PM_Pack/automation/current_policy_snapshot.json').write_text(
              json.dumps({'cycle_current': 84, 'last_completed_cycle': 'C083'})
          )
          Path('C:/AI_Runner/config').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/config/model_selection_policy.yaml').write_text('version: 1\\n')
          Path('C:/AI_Runner/config/cursor_adapter.yaml').write_text('provider: cursor\\n')
          Path('C:/AI_Runner/config/claude_adapter.yaml').write_text('provider: claude\\n')
          Path('C:/AI_Runner/state/cursor_model_state.json').write_text(
              json.dumps({'status': 'VERIFIED', 'model': 'codex-5.3'})
          )
          Path('C:/AI_Runner/state/claude_model_state.json').write_text(
              json.dumps({'status': 'VERIFIED', 'model': 'claude-subscription'})
          )
          hydration = Path('PM_Pack/07_hydration/HYDRATION_HEADER.md')
          if hydration.exists():
              txt = hydration.read_text()
              m = re.search(r'Active cycle:\\s*0*(\\d+)', txt)
              active_cycle = int(m.group(1)) if m else 81
              last_cycle = max(active_cycle - 1, 0)
              next_cycle = active_cycle + 1
              txt = re.sub(r'CYCLE_CURRENT:\\s*\\d+', f'CYCLE_CURRENT: {active_cycle:03d}', txt)
              txt = re.sub(r'CYCLE_PREVIOUS:\\s*\\d+', f'CYCLE_PREVIOUS: {last_cycle:03d}', txt)
              txt = re.sub(r'CYCLE_NEXT:\\s*\\d+', f'CYCLE_NEXT: {next_cycle:03d}', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', f'Active cycle: {active_cycle:03d}', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', f'Last completed cycle: {last_cycle:03d}', txt)
              txt = re.sub(
                  r'BRANCH_CURRENT:\\s*[^\\n]+',
                  f'BRANCH_CURRENT: cycle/{active_cycle:03d}/integration',
                  txt,
              )
              txt = re.sub(r'Branch:\\s*[^\\n]+', f'Branch: cycle/{active_cycle:03d}/integration', txt)
              hydration.write_text(txt)
          hydration_state = Path('PM_Pack/02_current_state/HYDRATION_HEADER.md')
          if hydration_state.exists():
              txt = hydration_state.read_text()
              txt = re.sub(r'CYCLE_CURRENT:\\s*\\d+', f'CYCLE_CURRENT: {active_cycle:03d}', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', f'Active cycle: {active_cycle:03d}', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', f'Last completed cycle: {last_cycle:03d}', txt)
              hydration_state.write_text(txt)
          snapshot = Path('PM_Pack/07_hydration/STATE_SNAPSHOT.md')
          if snapshot.exists():
              txt = snapshot.read_text()
              txt = re.sub(r'(# STATE SNAPSHOT - CYCLE\\s*)\\d+', rf'\\g<1>{active_cycle:03d}', txt)
              txt = re.sub(r'(# State Snapshot â€” Cycle\\s*)\\d+', rf'\\g<1>{active_cycle:03d}', txt)
              txt = re.sub(r'Cycle:\\s*\\d+', f'Cycle: {active_cycle:03d}', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', f'Active cycle: {active_cycle:03d}', txt)
              txt = re.sub(r'Previous cycle:\\s*\\d+', f'Previous cycle: {last_cycle:03d}', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', f'Last completed cycle: {last_cycle:03d}', txt)
              txt = re.sub(
                  r'Current branch:\\s*[^\\n]+',
                  f'Current branch: cycle/{active_cycle:03d}/integration',
                  txt,
              )
              txt = re.sub(r'Branch:\\s*[^\\n]+', f'Branch: cycle/{active_cycle:03d}/integration', txt)
              snapshot.write_text(txt)
          "
      - name: Brain check
        run: python automation/ai_cycle_controller.py brain-check
      - name: PM Pack audit
        run: python automation/ai_cycle_controller.py pm-pack-audit
