name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "cycle/**/integration"

jobs:
  checks:
    name: Lint, Typecheck, Tests, and Gates
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Ruff
        run: python -m ruff check .

      - name: Mypy
        run: python -m mypy src

      - name: Pytest with coverage
        run: python -m pytest -q --cov=src --cov-report=xml --cov-report=term-missing --cov-fail-under=90

      - name: Coverage summary
        run: python -m coverage report --fail-under=90

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: true
          verbose: true

      - name: Config check
        run: python run.py config-check

      - name: Foundation gate
        run: python run.py foundation-gate --database-url sqlite:///data/foundation_gate_ci.db

      - name: Phase2 smoke
        run: python run.py phase2-smoke

  codecov_project:
    name: codecov/project
    runs-on: ubuntu-latest
    needs: checks
    steps:
      - name: Download coverage artifact
        uses: actions/download-artifact@v4
        with:
          name: coverage-xml

      - name: Enforce project coverage threshold
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET

          threshold = 90.0
          root = ET.parse("coverage.xml").getroot()
          line_rate = root.attrib.get("line-rate")
          if line_rate is None:
              raise SystemExit("coverage.xml missing line-rate attribute")
          coverage_pct = float(line_rate) * 100.0
          print(f"Project coverage: {coverage_pct:.2f}% (threshold {threshold:.2f}%)")
          if coverage_pct < threshold:
              raise SystemExit(
                  f"codecov/project failed: {coverage_pct:.2f}% < {threshold:.2f}%"
              )
          PY
