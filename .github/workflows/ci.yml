name: CI

on:
  pull_request:
    branches:
      - develop
      - main
  push:
    branches:
      - develop
      - main
      - "cycle/**/integration"
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  statuses: read
  pull-requests: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: CI / lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Ruff
        run: python -m ruff check automation/ src/ tests/ --ignore I001,UP035,W605

  type-check:
    name: CI / type-check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: Mypy
        run: python -m mypy src

  tests-coverage:
    name: CI / tests-coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      statuses: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CI state bootstrap
        run: |
          python -c "
          import json
          from pathlib import Path
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/secrets').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state/controller_state.json').write_text(
              json.dumps({'status': 'PLANNED', 'active_cycle': 80, 'last_merged_cycle': 79})
          )
          Path('C:/AI_Runner/state/heartbeat.json').write_text(
              json.dumps(
                  {'last_seen': '2026-06-15T00:00:00Z', 'status': 'OK', 'active_cycle': 80}
              )
          )
          Path('C:/AI_Runner/state/provider_health.json').write_text(
              json.dumps(
                  {
                      'cursor_cli': {'status': 'HEALTHY', 'last_ok': '2026-06-15T00:00:00Z'},
                      'claude_subscription': {'status': 'HEALTHY'},
                      'openai_api': {'status': 'HEALTHY'},
                      'codex_subscription': {'status': 'HEALTHY'},
                  }
              )
          )
          Path('PM_Pack/automation').mkdir(parents=True, exist_ok=True)
          Path('PM_Pack/automation/current_policy_snapshot.json').write_text(
              json.dumps({'cycle_current': 80, 'last_completed_cycle': 'C079'})
          )
          Path('C:/AI_Runner/secrets/runner.env').write_text('JIRA_API_TOKEN=ci-placeholder')
          "
      - name: Pytest with coverage
        run: >
          python -m pytest tests/unit/
          --ignore=tests/unit/test_queue_processor.py
          --ignore=tests/unit/test_collection_orchestrator.py
          --ignore=tests/unit/test_cycle062_smoke_aliases.py
          --ignore=tests/unit/test_post_cycle_review_coverage.py
          --ignore=tests/unit/test_ai_cycle_controller_coverage.py
          --ignore=tests/unit/test_cursor_adapter.py
          --ignore=tests/unit/test_openai_api_adapter.py
          --ignore=tests/unit/test_playbook_generator.py
          --ignore=tests/unit/test_prompt_generator.py
          --cov=src --cov=automation --cov-report=xml --cov-fail-under=80
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4.6.2
        if: always()
        with:
          name: coverage-xml
          path: coverage.xml
      - name: Upload to Codecov
        uses: codecov/codecov-action@v5
        if: always()
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./coverage.xml
          fail_ci_if_error: false
          verbose: true

  smoke-gates:
    name: CI / smoke-gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4.2.2
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"
      - name: CI state bootstrap
        run: |
          python -c "
          import json
          import re
          from pathlib import Path
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state/controller_state.json').write_text(
              json.dumps({'status': 'PLANNED', 'active_cycle': 80, 'last_merged_cycle': 79})
          )
          Path('C:/AI_Runner/state/heartbeat.json').write_text(
              json.dumps(
                  {'last_seen': '2026-06-15T00:00:00Z', 'status': 'OK', 'active_cycle': 80}
              )
          )
          Path('PM_Pack/automation').mkdir(parents=True, exist_ok=True)
          Path('PM_Pack/automation/current_policy_snapshot.json').write_text(
              json.dumps({'cycle_current': 80, 'last_completed_cycle': 'C079'})
          )
          Path('C:/AI_Runner/config').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/state').mkdir(parents=True, exist_ok=True)
          Path('C:/AI_Runner/config/model_selection_policy.yaml').write_text('version: 1\\n')
          Path('C:/AI_Runner/config/cursor_adapter.yaml').write_text('provider: cursor\\n')
          Path('C:/AI_Runner/config/claude_adapter.yaml').write_text('provider: claude\\n')
          Path('C:/AI_Runner/state/cursor_model_state.json').write_text(
              json.dumps({'status': 'VERIFIED', 'model': 'codex-5.3'})
          )
          Path('C:/AI_Runner/state/claude_model_state.json').write_text(
              json.dumps({'status': 'VERIFIED', 'model': 'claude-subscription'})
          )
          hydration = Path('PM_Pack/07_hydration/HYDRATION_HEADER.md')
          if hydration.exists():
              txt = hydration.read_text()
              txt = re.sub(r'CYCLE_CURRENT:\\s*\\d+', 'CYCLE_CURRENT: 080', txt)
              txt = re.sub(r'CYCLE_PREVIOUS:\\s*\\d+', 'CYCLE_PREVIOUS: 079', txt)
              txt = re.sub(r'CYCLE_NEXT:\\s*\\d+', 'CYCLE_NEXT: 081', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', 'Active cycle: 080', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', 'Last completed cycle: 079', txt)
              txt = re.sub(
                  r'BRANCH_CURRENT:\\s*[^\\n]+',
                  'BRANCH_CURRENT: cycle/080/integration',
                  txt,
              )
              txt = re.sub(r'Branch:\\s*[^\\n]+', 'Branch: cycle/080/integration', txt)
              hydration.write_text(txt)
          hydration_state = Path('PM_Pack/02_current_state/HYDRATION_HEADER.md')
          if hydration_state.exists():
              txt = hydration_state.read_text()
              txt = re.sub(r'CYCLE_CURRENT:\\s*\\d+', 'CYCLE_CURRENT: 080', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', 'Active cycle: 080', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', 'Last completed cycle: 079', txt)
              hydration_state.write_text(txt)
          snapshot = Path('PM_Pack/07_hydration/STATE_SNAPSHOT.md')
          if snapshot.exists():
              txt = snapshot.read_text()
              txt = re.sub(r'(# STATE SNAPSHOT - CYCLE\\s*)\\d+', r'\\g<1>080', txt)
              txt = re.sub(r'(# State Snapshot â€” Cycle\\s*)\\d+', r'\\g<1>080', txt)
              txt = re.sub(r'Cycle:\\s*\\d+', 'Cycle: 080', txt)
              txt = re.sub(r'Active cycle:\\s*\\d+', 'Active cycle: 080', txt)
              txt = re.sub(r'Previous cycle:\\s*\\d+', 'Previous cycle: 079', txt)
              txt = re.sub(r'Last completed cycle:\\s*\\d+', 'Last completed cycle: 079', txt)
              txt = re.sub(
                  r'Current branch:\\s*[^\\n]+',
                  'Current branch: cycle/080/integration',
                  txt,
              )
              txt = re.sub(r'Branch:\\s*[^\\n]+', 'Branch: cycle/080/integration', txt)
              snapshot.write_text(txt)
          "
      - name: Brain check
        run: python automation/ai_cycle_controller.py brain-check
      - name: PM Pack audit
        run: python automation/ai_cycle_controller.py pm-pack-audit
