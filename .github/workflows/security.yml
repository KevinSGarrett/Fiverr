name: Security

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop]

jobs:
  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v7

      - name: Scan for secrets
        run: |
          FOUND=0
          # Exclude test files from secret scan (they use fake keys intentionally)
          if grep -rn 'sk-[a-zA-Z0-9]\{20,\}' src/ --include="*.py" 2>/dev/null; then
            echo "::error::Potential OpenAI API key found in source code"
            FOUND=1
          fi
          if grep -rn 'password\s*=' src/ --include="*.py" | grep -v 'test\|mock\|example\|placeholder\|getenv\|environ\|password_env_var\|proxy' 2>/dev/null; then
            echo "::error::Potential hardcoded password found"
            FOUND=1
          fi
          if grep -rn 'secret\s*=' src/ --include="*.py" | grep -v 'test\|mock\|example\|getenv\|environ' 2>/dev/null; then
            echo "::error::Potential hardcoded secret found"
            FOUND=1
          fi
          if grep -rn 'postgresql://.*:.*@' src/ --include="*.py" | grep -v 'example\|placeholder\|getenv' 2>/dev/null; then
            echo "::error::Potential DB connection string with credentials found"
            FOUND=1
          fi
          if [ $FOUND -eq 1 ]; then
            exit 1
          fi
          echo "No secrets detected."

  dependency-audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pip-audit
        run: pip install pip-audit
      - name: Audit dependencies
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2022-42969 || true
