name: Runner Smoke Test

on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'   # Daily at 06:00 UTC

jobs:
  smoke:
    name: Runner smoke
    runs-on: [self-hosted, fiverr-runner, windows, cursor, dedicated, ai-dev]
    timeout-minutes: 10

    steps:
      - name: Checkout develop
        uses: actions/checkout@v4
        with:
          ref: develop

      - name: Tool versions
        shell: pwsh
        run: |
          git --version
          gh --version
          python --version
          pwsh --version

      - name: Cursor CLI check (standalone agent.cmd ONLY)
        shell: pwsh
        run: |
          # Discover standalone Cursor CLI — must NOT be Cursor Desktop
          $cliPath = "C:\Users\Windows 11\AppData\Local\cursor-agent\agent.cmd"
          $desktopPath = "C:\Users\Windows 11\AppData\Local\Programs\cursor\resources\app\bin\cursor.CMD"

          # Fail hard if only desktop is available
          if (-not (Test-Path $cliPath)) {
            Write-Error "Standalone Cursor CLI not found at $cliPath"
            Write-Error "Install via: irm 'https://cursor.com/install?win32=true' | iex"
            exit 1
          }

          $ver = (& $cliPath --version 2>&1)
          Write-Host "Cursor CLI version: $ver"

          # Fail if version looks like Cursor Desktop (3.x.xx format)
          if ($ver -match "^\d+\.\d+\.\d+$") {
            Write-Error "FAIL: Resolved binary looks like Cursor Desktop ($ver), not standalone CLI"
            exit 1
          }
          Write-Host "PASS: Standalone Cursor CLI confirmed"

      - name: Python venv
        shell: pwsh
        run: |
          Set-Location C:\Fiverr\Fiverr
          .venv\Scripts\python.exe -c "import click, yaml, requests, pydantic; print('venv OK')"

      - name: PM_Pack brain check
        shell: pwsh
        run: |
          Set-Location C:\Fiverr\Fiverr
          .venv\Scripts\python.exe automation\ai_cycle_controller.py brain-check

      - name: Cursor CLI non-interactive smoke
        shell: pwsh
        run: |
          Set-Location C:\Fiverr\Fiverr
          .venv\Scripts\python.exe automation\ai_cycle_controller.py cursor-smoke

      - name: Health check
        shell: pwsh
        run: |
          powershell -File C:\AI_Runner\scripts\health_check.ps1

      - name: Config check
        shell: pwsh
        run: |
          Set-Location C:\Fiverr\Fiverr
          .venv\Scripts\python.exe run.py config-check
