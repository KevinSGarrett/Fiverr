name: Runner Smoke Test

on:
  workflow_dispatch:

jobs:
  smoke:
    runs-on: [self-hosted, Windows, X64, fiverr-ai-runner]
    steps:
      - id: checkout
        name: Checkout repo
        if: always()
        uses: actions/checkout@v4

      - id: verify_python
        name: Verify Python
        if: always()
        shell: pwsh
        run: python --version

      - id: verify_git
        name: Verify Git
        if: always()
        shell: pwsh
        run: git --version

      - id: verify_gh
        name: Verify GitHub CLI
        if: always()
        shell: pwsh
        run: gh --version

      - id: verify_cursor_cli
        name: Verify Cursor CLI
        if: always()
        shell: pwsh
        run: '& "C:\Users\Windows 11\AppData\Local\cursor-agent\agent.cmd" --version'

      - id: verify_repo_path
        name: Verify repo path
        if: always()
        shell: pwsh
        run: |
          $repo = (git rev-parse --show-toplevel).Trim()
          Write-Host "Repo path: $repo"
          if ($repo -ne "C:/Fiverr/Fiverr" -and $repo -ne "C:\\Fiverr\\Fiverr") {
            throw "Unexpected repo path: $repo"
          }

      - id: verify_brain
        name: Verify PM_Pack brain
        if: always()
        shell: pwsh
        run: python automation/ai_cycle_controller.py brain-check

      - id: verify_model_state
        name: Verify model state
        if: always()
        shell: pwsh
        run: |
          $path = "C:\AI_Runner\state\cursor_model_state.json"
          if (-not (Test-Path $path)) { throw "Missing model state: $path" }
          $json = Get-Content $path -Raw | ConvertFrom-Json
          if ($json.status -ne "VERIFIED") { throw "Model status is not VERIFIED" }
          Write-Host "Model status VERIFIED"

      - id: write_smoke_result
        name: Write smoke result
        if: always()
        shell: pwsh
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          $logPath = "C:\AI_Runner\logs\smoke_test_latest.json"
          $result = @{
            timestamp_utc = (Get-Date).ToUniversalTime().ToString("o")
            workflow = "runner-smoke"
            overall = $env:JOB_STATUS
            checks = @(
              "checkout",
              "verify_python",
              "verify_git",
              "verify_gh",
              "verify_cursor_cli",
              "verify_repo_path",
              "verify_brain",
              "verify_model_state"
            )
          } | ConvertTo-Json -Depth 4
          New-Item -ItemType Directory -Path (Split-Path $logPath) -Force | Out-Null
          Set-Content -Path $logPath -Value $result -Encoding UTF8
          Write-Host "Smoke result written to $logPath"

