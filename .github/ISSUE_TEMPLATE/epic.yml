name: Epic Tracker
description: Track an entire epic with all its stories
title: "[Epic]: "
labels: ["issue:epic", "priority:P2-high"]
body:
  - type: input
    id: epic_id
    attributes:
      label: Epic ID
      placeholder: "Epic 01"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Epic Description
      description: What does this epic deliver?
    validations:
      required: true
  - type: textarea
    id: stories
    attributes:
      label: Stories
      description: List all stories in this epic with links
      placeholder: |
        - [ ] S1.1 — Project Scaffolding (#issue)
        - [ ] S1.2 — Config System (#issue)
        - [ ] S1.3 — Database Models (#issue)
    validations:
      required: true
  - type: textarea
    id: dependencies
    attributes:
      label: Dependencies
      description: What must be complete before this epic can start?
  - type: input
    id: target_version
    attributes:
      label: Target Version
      placeholder: "v0.1.0"
  - type: textarea
    id: success_criteria
    attributes:
      label: Epic Completion Criteria
      description: What makes this epic done?
      placeholder: |
        - [ ] All stories merged to develop
        - [ ] Integration tests pass
        - [ ] Coverage >= 80%
        - [ ] Release PR merged to main
        - [ ] Version tag created
